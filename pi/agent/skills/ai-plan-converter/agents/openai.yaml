interface:
  display_name: "方案转换器"
  short_description: "将已确认的人类方案转换为 AI 可执行方案"
  default_prompt: "Use $ai-plan-converter to read the confirmed human decision plan, inspect the current code, and produce an executor-ready implementation plan for $ai-plan-executor without modifying code. This is optional before execution; $ai-plan-executor can run the same conversion internally. Stop on unresolved business or scope conflicts."

policy:
  allow_implicit_invocation: false
