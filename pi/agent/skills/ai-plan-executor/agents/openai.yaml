interface:
  display_name: "AI 方案执行器"
  short_description: "接收已确认方案，自动转换并安全完成实现、验证与交付"
  default_prompt: "Use $ai-plan-executor as the single execution entry. Ask the user for an exact provider/model, accept either a confirmed human decision plan or an executor-ready plan, internally convert human plans when needed, delegate the complete task to the global plan-executor subagent, wait for completion, support cancellation, then return the conversion, execution, and validation report."
policy:
  allow_implicit_invocation: false